# Managed downstream by codemod/codex-review-action.
# Make repository-specific changes in the source template, not in the generated copy.
name: Codex Review Command

on:
  issue_comment:
    types:
      - created

concurrency:
  group: codex-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codex-review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/codex-review' &&
      contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The sync workflow replaces @main with the target action commit SHA.
      - uses: codemod/codex-review-action@main
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.issue.number }}
          codex_model: ${{ vars.AZURE_OPENAI_CODEX_MODEL }}
          azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          azure_openai_responses_endpoint: ${{ secrets.AZURE_OPENAI_RESPONSES_ENDPOINT }}
          node_version: "24"
          pnpm_version: "10.15.0"
          install_command: pnpm install --no-frozen-lockfile --ignore-scripts
          working_directory: .
          codex_effort: high
          permission_profile: ":workspace"
          review_focus: |
            Focus on:
            - correctness bugs
            - behavioral regressions
            - missing negative or edge-case tests
            - codemod false positives and false negatives
            - security gaps in the transformed output
          extra_prompt: |
            Follow the repository-specific review guidance in .github/codex/review-instructions.md.
            Ignore style-only nits and do not review intentionally vulnerable input fixtures as if they were production code.
