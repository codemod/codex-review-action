# Managed downstream by codemod/codex-review-action.
# Make repository-specific changes in the source template, not in the generated copy.
name: Codex Review Command

on:
  issue_comment:
    types:
      - created

concurrency:
  group: codex-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch-arc-review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/codex-review' &&
      contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Dispatch Arc Generated Codemod PR Review
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const allowedAssociations = new Set(["OWNER", "MEMBER"]);

            if (!issue?.pull_request) {
              core.setFailed("/codex-review can only be used on a pull request");
              return;
            }
            if (String(comment?.body || "") !== "/codex-review") {
              core.setFailed("The comment did not contain the exact /codex-review command");
              return;
            }
            if (!allowedAssociations.has(comment?.author_association)) {
              core.setFailed("/codex-review can only be run by a repository owner or organization member");
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "arc-generated-codemod-pr-review.yml",
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number: String(issue.number),
                enable_auto_merge: "true",
                enable_auto_fix: "true",
                force_auto_fix: "false",
              },
            });

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              content: "eyes",
            });
