name: Sync Action Pins

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action_sha:
        description: Optional full action SHA to sync instead of the current workflow commit
        required: false
        type: string

jobs:
  sync-pins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: codemod/arc-codemods
            repo_name: arc-codemods
            command_workflow_template: ""
          - repo: codemod/codemod
            repo_name: codemod
            command_workflow_template: examples/codex-review-command.yml
          - repo: codemod/codemod-app
            repo_name: codemod-app
            command_workflow_template: examples/codex-review-command.yml
    permissions:
      contents: read
    steps:
      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.action_sha }}
        run: |
          target_sha="${INPUT_SHA:-${GITHUB_SHA}}"
          if ! printf '%s' "$target_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Target SHA must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${target_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ACTION_SYNC_APP_ID }}
          private-key: ${{ secrets.ACTION_SYNC_APP_PRIVATE_KEY }}
          owner: codemod
          repositories: ${{ matrix.repo_name }}

      - name: Checkout action source at target SHA
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.resolve.outputs.target_sha }}
          path: action-source
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: repo
          fetch-depth: 0

      - name: Update action pin and command workflow
        id: update
        working-directory: repo
        env:
          ACTION_SOURCE: ${{ github.workspace }}/action-source
          COMMAND_WORKFLOW_TEMPLATE: ${{ matrix.command_workflow_template }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: |
          review_workflow_path=".github/workflows/codex-pr-review.yml"
          command_workflow_path=".github/workflows/codex-review-command.yml"

          if [ ! -f "$review_workflow_path" ]; then
            echo "Expected workflow file not found: $review_workflow_path" >&2
            exit 1
          fi

          current_ref=$(grep -Eo 'codemod/codex-review-action@[0-9a-f]{40}' "$review_workflow_path" | head -n 1 || true)
          current_sha="${current_ref##*@}"
          current_sha="${current_sha:-not-present}"
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"

          if [ "$current_sha" != "not-present" ] && [ "$current_sha" != "$TARGET_SHA" ]; then
            perl -0pi -e "s/codemod\\/codex-review-action\\@[0-9a-f]{40}/codemod\\/codex-review-action\\@$TARGET_SHA/" "$review_workflow_path"
          fi

          if [ -n "$COMMAND_WORKFLOW_TEMPLATE" ]; then
            template_path="$ACTION_SOURCE/$COMMAND_WORKFLOW_TEMPLATE"
            if [ ! -f "$template_path" ]; then
              echo "Command workflow template not found at target SHA: $COMMAND_WORKFLOW_TEMPLATE" >&2
              exit 1
            fi

            mkdir -p "$(dirname "$command_workflow_path")"
            cp "$template_path" "$command_workflow_path"
            perl -0pi -e "s/codemod\\/codex-review-action\\@main/codemod\\/codex-review-action\\@$TARGET_SHA/" "$command_workflow_path"
          else
            rm -f "$command_workflow_path"
          fi

          if [ -z "$(git status --porcelain -- "$review_workflow_path" "$command_workflow_path")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: repo
          branch: codex/update-codex-review-action-${{ steps.resolve.outputs.short_sha }}
          delete-branch: true
          commit-message: "chore(ci): update codex review action to ${{ steps.resolve.outputs.short_sha }}"
          title: "chore(ci): update codex review action to ${{ steps.resolve.outputs.short_sha }}"
          body: |
            This PR syncs the Codex review integration from [`codemod/codex-review-action`](https://github.com/codemod/codex-review-action):

            - updates the pinned action SHA in `.github/workflows/codex-pr-review.yml` when that workflow uses the central action
            - syncs the repository-specific `/codex-review` integration for owners and organization members

            Target SHA: `${{ steps.resolve.outputs.target_sha }}`
            Previous automatic-review SHA: `${{ steps.update.outputs.current_sha }}`

            This PR was created automatically from [`codemod/codex-review-action`](https://github.com/codemod/codex-review-action).
          draft: true
